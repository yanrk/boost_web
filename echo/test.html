<!DOCTYPE html>
<html>
    <head>
        <title>WebSocket Test Client</title>
        <meta charset="utf-8">
    </head>
    <body>
        <h1>WebSocket Test Client</h1>
        <p>
            <button onClick="initWebSocket();">Connect</button>
            <button onClick="stopWebSocket();">Disconnect</button>
            <button onClick="checkSocket();">State</button>
        </p>
        <p>
            <textarea id="debugTextArea" style="width:400px;height:200px;"></textarea>
        </p>
        <p>
            <input type="text" id="inputBinary" onkeydown="if(event.keyCode==13)sendBinary();"/>
            <button onClick="sendBinary();">SendBinary</button>
        </p>
        <p>
            <input type="text" id="inputText" onkeydown="if(event.keyCode==13)sendText();"/>
            <button onClick="sendText();">SendText</button>
        </p>

        <script type="text/javascript">
            var debugTextArea = document.getElementById("debugTextArea");
            var wsUri = "ws://127.0.0.1:12345/";
            var websocket = null;

            function debug(message) {
                debugTextArea.value += message + "\n";
                debugTextArea.scrollTop = debugTextArea.scrollHeight;
            }

            function sendBinary() {
                var input = document.getElementById("inputBinary").value;
                if ( websocket != null && WebSocket.OPEN == websocket.readyState )
                {
                    document.getElementById("inputBinary").value = "";
                    binary = new TextEncoder().encode(input);
                    debug("send binary data size is " + binary.byteLength);
                    websocket.send(binary);
                }
            }

            function sendText() {
                var input = document.getElementById("inputText").value;
                if ( websocket != null && WebSocket.OPEN == websocket.readyState )
                {
                    document.getElementById("inputText").value = "";
                    debug("send text: <" + input + ">");
                    debug("send text data size is " + new TextEncoder().encode(input).byteLength);
                    websocket.send( input );
                }
            }

            function initWebSocket() {
                try {
                    if (typeof MozWebSocket == 'function')
                        WebSocket = MozWebSocket;
                    if ( websocket && websocket.readyState == 1 )
                        websocket.close();
                    websocket = new WebSocket( wsUri );
                    websocket.onopen = function (evt) {
                        debug("CONNECTED");
                    };
                    websocket.onclose = function (evt) {
                        debug("DISCONNECTED");
                    };
                    websocket.onmessage = function (evt) {
                        if (evt.data instanceof Blob) {
                            debug("recv binary data size is " + evt.data.size)
                        } else {
                            debug("recv text: <" + evt.data + ">");
                            debug("recv text data size is " + new TextEncoder().encode(evt.data).byteLength)
                        }
                    };
                    websocket.onerror = function (evt) {
                        debug('ERROR: ' + evt.data);
                    };
                } catch (exception) {
                    debug('ERROR: ' + exception);
                }
            }

            function stopWebSocket() {
                if (websocket)
                    websocket.close();
            }

            function checkSocket() {
                if (websocket != null) {
                    var stateStr;
                    switch (websocket.readyState) {
                        case 0: {
                            stateStr = "CONNECTING";
                            break;
                        }
                        case 1: {
                            stateStr = "OPEN";
                            break;
                        }
                        case 2: {
                            stateStr = "CLOSING";
                            break;
                        }
                        case 3: {
                            stateStr = "CLOSED";
                            break;
                        }
                        default: {
                            stateStr = "UNKNOW";
                            break;
                        }
                    }
                    debug("WebSocket state = " + websocket.readyState + " ( " + stateStr + " )");
                } else {
                    debug("WebSocket is null");
                }
            }
        </script>
    </body>
</html>
